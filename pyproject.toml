[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lora_budget"
version = "0.1.0"
description = "LoRA on a Budget: controlled fine-tuning study on a single 16 GB GPU (CMPE 252)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
